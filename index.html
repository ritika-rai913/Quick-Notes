<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Note</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="note">
    <header>
        <h1>Quick Note</h1>
        <div>
            <button class="add-note-btn" id="add-note">+ Add Note</button>
            <button id="theme-toggle" class="theme-toggle-btn">🌙</button>
        </div>
   </header>

   <main id="note-container" class="main-grid">
    </main>
    <div class="my-Notes">
    </div>
    </div>
    <div class="dialog-content">
        <div class="dialog-header">
            <h2 id="dailogTitle" class="dialog-title" >Add New Notes</h2>
            <button class="close-btn">X</button>
        </div>
            <div class="form-group">
                <label class="form-label">Title</label><br>
                <input type="text" id="note-title" class="form-input" placeholder="Enter note title..">
            </div>
            <div class="form-group">
               <label class="form-label">content</label><br>
               <textarea id="note-content" class="form-title form-input" placeholder="Write your note here.."></textarea>
            </div>

            <div class="dialog-action">
                <button type="button" class="cancel-btn">Cancel</button>
                <button type="submit" class="save-note">Save Note</button>
            </div>
    </div>
   <script src="main.js"></script>
</body>
</html>
